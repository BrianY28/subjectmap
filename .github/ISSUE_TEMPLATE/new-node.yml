name: New node
description: Propose a new node for the map, with a draft note, concepts, and sources.
title: "[New node] "
body:
  - type: dropdown
    id: subject
    attributes:
      label: Subject
      options:
        - Physics
        - Chemistry
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        A node is one topic, one Markdown file. Keep it narrow: if you can split it into two nodes without losing anything, it is probably two nodes.

  - type: input
    id: proposed-title
    attributes:
      label: Proposed title
      description: Seven words at most. This becomes the `# Title` line and the file name.
      placeholder: Chemical equilibrium
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch folder
      description: The full branch path within the selected subject.
      placeholder: subjects/chemistry/nodes/03-thermodynamics-equilibrium
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it belongs in the map
      description: What this node connects to, and why the map is incomplete without it.
    validations:
      required: true

  - type: textarea
    id: draft-note
    attributes:
      label: Draft note
      description: One or two sentences, plain language, saying what the idea is and why it mattered.
      placeholder: Relates the equilibrium composition of a reversible reaction to the activities of reactants and products.
    validations:
      required: false

  - type: textarea
    id: concepts
    attributes:
      label: Concepts
      description: Two to five lines, one concept per line. These become the `## Concepts` list.
      placeholder: |-
        Dynamic equilibrium
        Mass action
        Reaction quotient and direction
        Equilibrium versus reaction rate
    validations:
      required: false

  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Full citations - authors, title, journal or publisher, year, and DOI or stable URL. At least one.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched the map and this topic is not already covered
          required: true
