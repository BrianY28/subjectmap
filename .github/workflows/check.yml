name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check both subjects and tracked indexes / OPML exports
        run: python3 tools/build.py --check
      - name: Test validation and site generation
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check the equilibrium model
        run: node tools/test_equilibrium.cjs
