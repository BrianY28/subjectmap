name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"  # the build also runs on 3.9+, but the hosted runners no longer ship 3.9
      - name: Check node files and generated INDEX.md / map.opml
        run: python3 tools/build.py --check
      - name: Test validation and site generation
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check the equilibrium model
        run: node tools/test_equilibrium.cjs
